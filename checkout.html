<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Pesanan — ProStroke Billiard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Penyesuaian layout agar mengikuti struktur vertikal bersih seperti referensi
       tanpa merusak warna, font, dan variabel dari style.css */
    .checkout-single-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .checkout-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    .checkout-brand-intro {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .checkout-brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #d4af37, #a67c00);
      color: #111;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .checkout-brand-intro h2 {
      margin: 0 0 0.2rem 0;
      font-size: 1.2rem;
    }

    .checkout-brand-intro p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted, #9ca3af);
    }

    /* Input bertumpuk satu kolom */
    .stack-form .form-group {
      margin-bottom: 1.1rem;
    }

    .stack-form label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.45rem;
      font-size: 0.92rem;
    }

    .stack-form .form-control {
      width: 100%;
      padding: 0.8rem 0.95rem;
      border-radius: 8px;
    }

    /* Input nomor telepon terbagi dua (Kode Negara + Nomor) */
    .phone-split-group {
      display: flex;
      align-items: stretch;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
    }

    .phone-country-box {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.85rem;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      user-select: none;
    }

    .phone-input-inner {
      display: flex;
      align-items: center;
      flex: 1;
      padding-left: 0.75rem;
    }

    .phone-prefix {
      color: var(--text-muted, #9ca3af);
      font-weight: 500;
      margin-right: 0.4rem;
      font-size: 0.95rem;
    }

    .phone-input-inner input {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding-left: 0 !important;
      width: 100%;
    }

    /* Kotak konfirmasi bergaya box verifikasi pada referensi */
    .confirm-check-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
      margin: 1.25rem 0;
    }

    .confirm-check-left {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .confirm-check-left input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: #d4af37;
      cursor: pointer;
    }

    .summary-compact-box {
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 1.25rem;
    }

    .checkout-terms-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted, #9ca3af);
      margin-top: 0.9rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div id="site-header-root"></div>

  <header class="page-banner">
    <div class="container">
      <span class="step-tag">Langkah 2 dari 3</span>
      <h1>Checkout Pesanan</h1>
      <p>Lengkapi data penerima dan konfirmasi rincian tongkat billiard sebelum membayar dengan QRIS.</p>
    </div>
  </header>

  <main class="page-container">
    <div id="checkout-root" class="checkout-single-wrap"></div>
  </main>

  <div id="site-footer-root"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.PSStore;
      store.renderHeader("cart");
      store.renderFooter();

      const root = document.getElementById("checkout-root");
      let shippingMethod = "courier";

      function renderCheckout() {
        const cart = store.getCart();
        if (cart.length === 0) {
          root.innerHTML =
            '<div class="panel empty-state">' +
            '  <h3>Tidak ada item untuk di-checkout</h3>' +
            '  <p>Keranjang belanja Anda kosong. Silakan pilih tongkat billiard di katalog terlebih dahulu.</p>' +
            '  <a href="index.html" class="btn-gold">Buka Katalog</a>' +
            '</div>';
          return;
        }

        const ongkir = shippingMethod === "pickup" ? 0 : 35000;
        const totals = store.getCartTotals(ongkir);

        const summaryItemsHtml = cart.map(function (item) {
          return (
            '<div class="summary-row" style="align-items:flex-start; gap:0.75rem;">' +
            '  <span>' + store.escapeHtml(item.name) + ' <small style="color:var(--text-muted);">&times;' + item.qty + '<br>' + store.escapeHtml(item.variant) + '</small></span>' +
            '  <strong style="white-space:nowrap;">' + store.formatRupiah(item.unitPrice * item.qty) + '</strong>' +
            '</div>'
          );
        }).join("");

        root.innerHTML =
          '<form id="checkout-form" class="panel stack-form">' +
          '  <div class="checkout-header-bar">' +
          '    <span style="color:var(--text-muted);">Langkah 2 / 3 &bull; Pengiriman</span>' +
          '    <a href="cart.html" style="color:var(--gold, #d4af37); font-weight:600; text-decoration:none;">Ubah Keranjang &rarr;</a>' +
          '  </div>' +

          '  <div class="checkout-brand-intro">' +
          '    <div class="checkout-brand-badge">PS</div>' +
          '    <div>' +
          '      <h2>Detail Pengiriman &amp; Pembayaran</h2>' +
          '      <p>Packing pipa PVC aman &amp; verifikasi QRIS instan</p>' +
          '    </div>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="shipping">Metode Pengiriman</label>' +
          '    <select id="shipping" name="shipping" class="form-control">' +
          '      <option value="courier" ' + (shippingMethod === "courier" ? "selected" : "") + '>Kurir Khusus + Packing Pipa PVC (Rp 35.000)</option>' +
          '      <option value="pickup" ' + (shippingMethod === "pickup" ? "selected" : "") + '>Ambil di Showroom Jakarta Pusat (Gratis)</option>' +
          '    </select>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="nama">Nama Lengkap *</label>' +
          '    <input type="text" id="nama" name="nama" class="form-control" placeholder="Nama Lengkap Penerima" required>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="kota">Kota / Kabupaten *</label>' +
          '    <input type="text" id="kota" name="kota" class="form-control" placeholder="Contoh: Surabaya" required>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="telepon">Nomor WhatsApp / Ponsel *</label>' +
          '    <div class="phone-split-group">' +
          '      <div class="phone-country-box">' +
          '        <span>🇮🇩</span>' +
          '        <span>ID</span>' +
          '      </div>' +
          '      <div class="phone-input-inner">' +
          '        <span class="phone-prefix">+62</span>' +
          '        <input type="tel" id="telepon" name="telepon" class="form-control" placeholder="812 3456 789" required>' +
          '      </div>' +
          '    </div>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="alamat">Alamat Lengkap *</label>' +
          '    <textarea id="alamat" name="alamat" rows="3" class="form-control" placeholder="Nama jalan, nomor rumah, kecamatan, kode pos" required></textarea>' +
          '  </div>' +

          '  <div class="form-group">' +
          '    <label for="catatan">Catatan Tambahan (Opsional)</label>' +
          '    <input type="text" id="catatan" name="catatan" class="form-control" placeholder="Contoh: Cek kelurusan shaft &amp; sertakan joint protector">' +
          '  </div>' +

          '  <div class="summary-compact-box">' +
          '    <div class="panel-title" style="margin-bottom:0.75rem;"><span>Ringkasan Pesanan</span></div>' +
          '    ' + summaryItemsHtml +
          '    <hr class="summary-divider">' +
          '    <div class="summary-row">' +
          '      <span>Subtotal</span>' +
          '      <strong id="co-subtotal">' + store.formatRupiah(totals.subtotal) + '</strong>' +
          '    </div>' +
          (totals.discount > 0
            ? '<div class="summary-row discount">' +
              '  <span>Diskon Promo (' + store.escapeHtml(totals.promoCode) + ')</span>' +
              '  <strong>&minus;' + store.formatRupiah(totals.discount) + '</strong>' +
              '</div>'
            : '') +
          '    <div class="summary-row">' +
          '      <span>Ongkos Kirim</span>' +
          '      <strong id="co-ongkir">' + (totals.ongkir === 0 ? "Gratis" : store.formatRupiah(totals.ongkir)) + '</strong>' +
          '    </div>' +
          '    <hr class="summary-divider">' +
          '    <div class="summary-total" style="margin-bottom:0;">' +
          '      <span>Grand Total</span>' +
          '      <span id="co-grandtotal">' + store.formatRupiah(totals.grandTotal) + '</span>' +
          '    </div>' +
          '  </div>' +

          '  <div class="confirm-check-box">' +
          '    <div class="confirm-check-left">' +
          '      <input type="checkbox" id="confirm-order" required>' +
          '      <label for="confirm-order" style="margin:0; font-weight:500; cursor:pointer;">' +
          '        Data pengiriman sudah benar &amp; bayar via <strong>QRIS Instan</strong>' +
          '        <span style="display:block; font-size:0.78rem; color:var(--text-muted); font-weight:400; margin-top:2px;">Status pembayaran diverifikasi otomatis secara realtime.</span>' +
          '      </label>' +
          '    </div>' +
          '    <span class="status-badge status-paid">QRIS</span>' +
          '  </div>' +

          '  <button type="submit" class="btn-gold btn-block" style="padding:0.9rem; font-size:1rem;">Buat Pesanan &amp; Bayar QRIS &rarr;</button>' +
          '  <a href="cart.html" class="btn-outline btn-block" style="margin-top:0.65rem; text-align:center;">&larr; Kembali ke Keranjang</a>' +

          '  <p class="checkout-terms-note">' +
          '    Dengan melanjutkan pesanan, Anda menyetujui ketentuan pengiriman &amp; garansi kelurusan shaft ProStroke Billiard.' +
          '  </p>' +
          '</form>';

        const shippingSelect = document.getElementById("shipping");
        shippingSelect.addEventListener("change", function () {
          shippingMethod = shippingSelect.value;
          const newOngkir = shippingMethod === "pickup" ? 0 : 35000;
          const t = store.getCartTotals(newOngkir);
          document.getElementById("co-ongkir").textContent = t.ongkir === 0 ? "Gratis" : store.formatRupiah(t.ongkir);
          document.getElementById("co-grandtotal").textContent = store.formatRupiah(t.grandTotal);
        });

        const form = document.getElementById("checkout-form");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          const rawPhone = document.getElementById("telepon").value.trim().replace(/^(\+62|62|0)/, "");
          const customer = {
            nama: document.getElementById("nama").value.trim(),
            telepon: "+62" + rawPhone,
            kota: document.getElementById("kota").value.trim(),
            alamat: document.getElementById("alamat").value.trim(),
            catatan: document.getElementById("catatan").value.trim()
          };
          const order = store.createOrder(customer, shippingMethod);
          if (order) {
            window.location.href = "payment.html?order=" + encodeURIComponent(order.id);
          }
        });
      }

      renderCheckout();
    })();
  </script>
</body>
</html>
