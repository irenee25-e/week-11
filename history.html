<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi — ProStroke Billiard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header-root"></div>

  <header class="page-banner">
    <div class="container">
      <span class="step-tag">Status Tersinkronisasi Realtime</span>
      <h1>Riwayat Transaksi</h1>
      <p>Pantau seluruh pesanan tongkat billiard dan status pembayaran QRIS Anda secara langsung.</p>
    </div>
  </header>

  <main class="page-container">
    <div id="history-root"></div>
  </main>

  <div id="site-footer-root"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.PSStore;
      store.renderHeader("history");
      store.renderFooter();

      const root = document.getElementById("history-root");
      let activeFilter = "ALL";
      let lastSignature = "";

      function getSignature(orders) {
        return activeFilter + "|" + orders.map(function (o) {
          return o.id + ":" + o.status + ":" + (o.paidAt || "");
        }).join(",");
      }

      function renderHistory(force) {
        const orders = store.getOrders();
        const sig = getSignature(orders);
        if (!force && sig === lastSignature) return;
        lastSignature = sig;

        if (orders.length === 0) {
          root.innerHTML =
            '<div class="panel empty-state">' +
            '  <h3>Belum ada riwayat transaksi</h3>' +
            '  <p>Pesanan tongkat billiard yang Anda buat akan tampil di sini lengkap dengan status pembayaran QRIS secara realtime.</p>' +
            '  <a href="index.html" class="btn-gold">Mulai Belanja</a>' +
            '</div>';
          return;
        }

        const filtered = orders.filter(function (o) {
          return activeFilter === "ALL" ? true : o.status === activeFilter;
        });

        const countPending = orders.filter(function (o) { return o.status === "PENDING"; }).length;
        const countPaid = orders.filter(function (o) { return o.status === "PAID"; }).length;
        const countRejected = orders.filter(function (o) { return o.status === "REJECTED"; }).length;

        const filterButtons =
          '<div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.15rem;">' +
          '  <button type="button" class="btn-sm ' + (activeFilter === "ALL" ? "btn-gold" : "btn-outline") + '" data-filter="ALL">Semua (' + orders.length + ')</button>' +
          '  <button type="button" class="btn-sm ' + (activeFilter === "PENDING" ? "btn-gold" : "btn-outline") + '" data-filter="PENDING">Menunggu (' + countPending + ')</button>' +
          '  <button type="button" class="btn-sm ' + (activeFilter === "PAID" ? "btn-gold" : "btn-outline") + '" data-filter="PAID">Paid (' + countPaid + ')</button>' +
          '  <button type="button" class="btn-sm ' + (activeFilter === "REJECTED" ? "btn-gold" : "btn-outline") + '" data-filter="REJECTED">Ditolak (' + countRejected + ')</button>' +
          '</div>';

        const rowsHtml = filtered.length === 0
          ? '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Tidak ada transaksi dengan filter ini.</td></tr>'
          : filtered.map(function (o) {
              const itemsText = o.items.map(function (it) {
                return store.escapeHtml(it.name) + " &times;" + it.qty;
              }).join(", ");

              const actionHtml =
                o.status === "PENDING"
                  ? '<a href="payment.html?order=' + encodeURIComponent(o.id) + '" class="btn-gold btn-sm">Bayar QRIS</a>'
                  : '<a href="thank-you.html?order=' + encodeURIComponent(o.id) + '" class="btn-outline btn-sm">Lihat Struk</a> ' +
                    '<a href="payment.html?order=' + encodeURIComponent(o.id) + '" class="btn-outline btn-sm">Status</a>';

              return (
                '<tr>' +
                '  <td>' +
                '    <strong>' + store.escapeHtml(o.id) + '</strong><br>' +
                '    <small style="color:var(--text-muted);">' + store.escapeHtml(store.formatWaktu(o.createdAt)) + '</small>' +
                '  </td>' +
                '  <td>' +
                '    <div><strong>' + store.escapeHtml(o.customer.nama) + '</strong></div>' +
                '    <small style="color:var(--text-muted);">' + store.escapeHtml(o.customer.kota) + '</small>' +
                '  </td>' +
                '  <td style="max-width:260px;">' + itemsText + '</td>' +
                '  <td>' +
                '    <div style="font-size:0.78rem; color:var(--text-muted);">Sub: ' + store.formatRupiah(o.subtotal) + '</div>' +
                '    <strong style="color:var(--gold);">' + store.formatRupiah(o.grandTotal) + '</strong>' +
                '  </td>' +
                '  <td>' +
                '    ' + store.renderStatusBadge(o.status) +
                (o.paidAt ? '<div style="font-size:0.72rem; color:var(--text-muted); margin-top:0.25rem;">' + store.escapeHtml(store.formatWaktu(o.paidAt)) + '</div>' : '') +
                '  </td>' +
                '  <td style="white-space:nowrap;">' + actionHtml + '</td>' +
                '</tr>'
              );
            }).join("");

        root.innerHTML =
          '<section class="panel">' +
          '  <div class="panel-title">' +
          '    <span>Daftar Transaksi</span>' +
          '    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">' +
          '      <a href="qris-approve.html" target="_blank" rel="noopener" class="btn-outline btn-sm">Simulator QRIS &#8599;</a>' +
          '      <a href="index.html" class="btn-outline btn-sm">Kembali ke Katalog</a>' +
          '    </div>' +
          '  </div>' +
          '  ' + filterButtons +
          '  <div class="table-wrap">' +
          '    <table class="data-table">' +
          '      <thead>' +
          '        <tr>' +
          '          <th>Invoice</th>' +
          '          <th>Penerima</th>' +
          '          <th>Item</th>' +
          '          <th>Total</th>' +
          '          <th>Status</th>' +
          '          <th>Aksi</th>' +
          '        </tr>' +
          '      </thead>' +
          '      <tbody>' + rowsHtml + '</tbody>' +
          '    </table>' +
          '  </div>' +
          '</section>';
      }

      root.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        activeFilter = btn.getAttribute("data-filter");
        renderHistory(true);
      });

      store.onRealtimeUpdate(function () {
        renderHistory(false);
      });

      setInterval(function () {
        renderHistory(false);
      }, 1000);

      renderHistory(true);
    })();
  </script>
</body>
</html>
