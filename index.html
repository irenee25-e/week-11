<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProStroke Billiard — Toko &amp; Katalog Tongkat Billiard Custom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header-root"></div>

  <main id="main-content"></main>

  <div id="site-footer-root"></div>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.PSStore;
      const params = new URLSearchParams(window.location.search);
      const kategoriParam = params.get("kategori");
      const produkParam = parseInt(params.get("produk"), 10);
      const favoritParam = params.get("favorit");

      const allCues = store.getAllCues();
      const activeCue = !isNaN(produkParam) ? allCues.find(function (c) { return c.id === produkParam; }) : null;
      const activeCat = activeCue
        ? store.kategoriBilliard.find(function (k) { return k.id === activeCue.kategoriId; })
        : store.kategoriBilliard.find(function (k) { return k.id === kategoriParam; });

      if (activeCue) {
        store.renderHeader("kategori", activeCue.kategoriId);
      } else if (activeCat) {
        store.renderHeader("kategori", activeCat.id);
      } else if (favoritParam === "1") {
        store.renderHeader("favorit");
      } else {
        store.renderHeader("home");
      }
      store.renderFooter();

      function getQtyInCartByCueId(cueId) {
        return store.getCart().reduce(function (sum, item) {
          return item.id === cueId ? sum + item.qty : sum;
        }, 0);
      }

      function renderCueCard(cue) {
        const favs = store.getFavorites();
        const isFav = favs.includes(cue.id);
        const badgeClass = cue.limited ? "stock-pill limited" : "stock-pill";
        const imgSrc = store.getImageUrl(cue.image);
        const specsText = "Tip: " + cue.tip + " | Berat: " + cue.weight + " | Joint: " + cue.joint + " | " + cue.material;
        const inCart = getQtyInCartByCueId(cue.id);
        const btnLabel = inCart > 0 ? "+ Tambah (" + inCart + ")" : "+ Beli";

        return (
          '<article class="product-card">' +
          '  <a class="product-media" href="index.html?produk=' + cue.id + '">' +
          '    <img src="' + store.escapeHtml(imgSrc) + '" alt="' + store.escapeHtml(cue.name) + '" loading="lazy" onerror="PSStore.handleImgError(this, \'' + store.escapeHtml(cue.image) + '\')">' +
          '    <button class="fav-btn ' + (isFav ? "active" : "") + '" type="button" title="Simpan ke Favorit" data-fav-id="' + cue.id + '">&#9829;</button>' +
          '    <span class="' + badgeClass + '">' + store.escapeHtml(cue.status) + '</span>' +
          '  </a>' +
          '  <div class="product-body">' +
          '    <div class="meta-row">' +
          '      <span class="cat-label">' + store.escapeHtml(cue.kategoriNama) + '</span>' +
          '      <span class="rating-label">&#9733; ' + cue.rating.toFixed(1) + '</span>' +
          '    </div>' +
          '    <a class="product-title-link" href="index.html?produk=' + cue.id + '">' + store.escapeHtml(cue.name) + '</a>' +
          '    <p class="product-specs">' + store.escapeHtml(specsText) + '</p>' +
          '    <div class="product-foot">' +
          '      <div class="price-now">' +
          '        ' + store.formatRupiah(cue.price) +
          (cue.oldPrice ? '<span class="price-old">' + store.formatRupiah(cue.oldPrice) + '</span>' : '') +
          '      </div>' +
          '      <button class="add-btn" type="button" data-quick-add="' + cue.id + '">' + btnLabel + '</button>' +
          '    </div>' +
          '  </div>' +
          '</article>'
        );
      }

      // 1. Home View
      function renderHomeView(container) {
        const spotlight = allCues.find(function (c) { return c.id === 29; }) || allCues[0];

        const categoryCardsHTML = store.kategoriBilliard.map(function (kat) {
          const cover = kat.cue[0];
          return (
            '<a class="cat-card" href="index.html?kategori=' + kat.id + '">' +
            '  <div class="cat-thumb">' +
            '    <img src="' + store.escapeHtml(store.getImageUrl(cover.image)) + '" alt="' + store.escapeHtml(kat.namaNav) + '" onerror="PSStore.handleImgError(this, \'' + store.escapeHtml(cover.image) + '\')">' +
            '  </div>' +
            '  <div>' +
            '    <h3>' + store.escapeHtml(kat.namaNav) + '</h3>' +
            '    <span>' + kat.cue.length + ' Tongkat</span>' +
            '  </div>' +
            '</a>'
          );
        }).join("");

        const categoryOptions = store.kategoriBilliard.map(function (k) {
          return '<option value="' + k.id + '">' + store.escapeHtml(k.namaNav) + '</option>';
        }).join("");

        container.innerHTML =
          '<section class="hero">' +
          '  <div class="container hero-grid">' +
          '    <div>' +
          '      <div class="hero-badge"><span class="hero-dot"></span> Koleksi Custom 2026 &bull; Ready Stock</div>' +
          '      <h1>Koleksi Tongkat Billiard <span>Custom &amp; Presisi</span></h1>' +
          '      <p class="hero-desc">Jelajahi 30 pilihan tongkat billiard berbahan Canadian Maple, Ebony, Ash, hingga Carbon Fiber dengan kalibrasi kelurusan &amp; keseimbangan presisi.</p>' +
          '      <div class="hero-actions">' +
          '        <a href="#katalog" class="btn-gold">Belanja Sekarang</a>' +
          '        <a href="#kategori" class="btn-outline">Lihat 6 Kategori</a>' +
          '      </div>' +
          '      <div class="hero-stats">' +
          '        <div class="stat-item"><strong>30+</strong><span>Model Tongkat</span></div>' +
          '        <div class="stat-item"><strong>100%</strong><span>QC Kelurusan</span></div>' +
          '        <div class="stat-item"><strong>4.9 &#9733;</strong><span>Rating Pemain</span></div>' +
          '      </div>' +
          '    </div>' +
          '    <a class="spotlight-card" href="index.html?produk=' + spotlight.id + '">' +
          '      <div class="spotlight-head">' +
          '        <span class="spotlight-tag">Spotlight Unggulan</span>' +
          '        <span class="rating-label">&#9733; ' + spotlight.rating.toFixed(1) + '</span>' +
          '      </div>' +
          '      <div class="spotlight-img">' +
          '        <img src="' + store.escapeHtml(store.getImageUrl(spotlight.image)) + '" alt="' + store.escapeHtml(spotlight.name) + '" onerror="PSStore.handleImgError(this, \'' + store.escapeHtml(spotlight.image) + '\')">' +
          '      </div>' +
          '      <div class="cat-label">' + store.escapeHtml(spotlight.kategoriJudul) + '</div>' +
          '      <div class="spotlight-title">' + store.escapeHtml(spotlight.name) + '</div>' +
          '      <div class="spotlight-specs">Tip: ' + spotlight.tip + ' | Berat: ' + spotlight.weight + ' | Joint: ' + spotlight.joint + '</div>' +
          '      <div class="spotlight-foot">' +
          '        <div>' +
          '          <strong style="color:#c9a24d; font-size:1.15rem;">' + store.formatRupiah(spotlight.price) + '</strong>' +
          (spotlight.oldPrice ? '<span class="price-old">' + store.formatRupiah(spotlight.oldPrice) + '</span>' : '') +
          '        </div>' +
          '        <span style="font-size:0.84rem; font-weight:700; color:#ffffff;">Pilih Varian &rarr;</span>' +
          '      </div>' +
          '    </a>' +
          '  </div>' +
          '</section>' +
          '<section class="section-block" id="kategori">' +
          '  <div class="container">' +
          '    <div class="section-header">' +
          '      <h2>Jelajahi Kategori</h2>' +
          '      <span>Pilih kategori untuk melihat koleksi khusus</span>' +
          '    </div>' +
          '    <div class="category-grid">' + categoryCardsHTML + '</div>' +
          '  </div>' +
          '</section>' +
          '<section class="section-block" id="katalog" style="padding-top:0.5rem;">' +
          '  <div class="container">' +
          '    <div class="controls-bar">' +
          '      <input type="text" id="search-input" class="search-input" placeholder="Cari nama tongkat, bahan kayu, atau tipe joint...">' +
          '      <select id="category-filter" class="filter-select">' +
          '        <option value="all">Semua Kategori</option>' +
          '        ' + categoryOptions +
          '      </select>' +
          '      <select id="sort-filter" class="filter-select">' +
          '        <option value="default">Urutkan: Default</option>' +
          '        <option value="price-asc">Harga: Terendah</option>' +
          '        <option value="price-desc">Harga: Tertinggi</option>' +
          '        <option value="rating-desc">Rating Tertinggi</option>' +
          '      </select>' +
          '    </div>' +
          '    <div class="section-header">' +
          '      <h2>Katalog Lengkap Tongkat Billiard</h2>' +
          '      <span id="product-count">Menampilkan ' + allCues.length + ' produk</span>' +
          '    </div>' +
          '    <div class="catalog-grid" id="catalog-container"></div>' +
          '  </div>' +
          '</section>';

        const searchInput = document.getElementById("search-input");
        const catSelect = document.getElementById("category-filter");
        const sortSelect = document.getElementById("sort-filter");

        function refreshCatalog() {
          const q = searchInput.value.toLowerCase().trim();
          const cat = catSelect.value;
          const sort = sortSelect.value;

          let filtered = allCues.filter(function (c) {
            const matchCat = cat === "all" || c.kategoriId === cat;
            const matchText =
              c.name.toLowerCase().includes(q) ||
              c.material.toLowerCase().includes(q) ||
              c.joint.toLowerCase().includes(q) ||
              c.kategoriNama.toLowerCase().includes(q);
            return matchCat && matchText;
          });

          if (sort === "price-asc") filtered.sort(function (a, b) { return a.price - b.price; });
          if (sort === "price-desc") filtered.sort(function (a, b) { return b.price - a.price; });
          if (sort === "rating-desc") filtered.sort(function (a, b) { return b.rating - a.rating; });

          document.getElementById("product-count").textContent = "Menampilkan " + filtered.length + " produk";
          const grid = document.getElementById("catalog-container");
          grid.innerHTML = filtered.length
            ? filtered.map(renderCueCard).join("")
            : '<p style="color:#9ba8a2;">Produk tidak ditemukan. Coba kata kunci lain.</p>';
        }

        searchInput.addEventListener("input", refreshCatalog);
        catSelect.addEventListener("change", refreshCatalog);
        sortSelect.addEventListener("change", refreshCatalog);
        refreshCatalog();

        store.onRealtimeUpdate(function () {
          refreshCatalog();
        });
      }

      // 2. Category View
      function renderCategoryView(container, katObj) {
        const cues = allCues.filter(function (c) { return c.kategoriId === katObj.id; });
        document.title = katObj.judul + " — ProStroke Billiard";

        function draw() {
          container.innerHTML =
            '<section class="page-banner">' +
            '  <div class="container">' +
            '    <h1>' + store.escapeHtml(katObj.judul) + '</h1>' +
            '    <div class="breadcrumb">' +
            '      <a href="index.html">Beranda</a>' +
            '      <span>/</span>' +
            '      <span>Kategori</span>' +
            '      <span>/</span>' +
            '      <strong style="color:#ffffff;">' + store.escapeHtml(katObj.namaNav) + '</strong>' +
            '    </div>' +
            '  </div>' +
            '</section>' +
            '<section class="section-block">' +
            '  <div class="container">' +
            '    <div class="cat-intro-box">' +
            '      <p><strong>Tentang ' + store.escapeHtml(katObj.namaNav) + ':</strong> ' + store.escapeHtml(katObj.deskripsi) + '</p>' +
            '      <span class="pill-count">' + cues.length + ' Model Tersedia</span>' +
            '    </div>' +
            '    <div class="catalog-grid">' + cues.map(renderCueCard).join("") + '</div>' +
            '  </div>' +
            '</section>';
        }
        draw();
        store.onRealtimeUpdate(draw);
      }

      // 3. Favorites View
      function renderFavoritesView(container) {
        document.title = "Daftar Favorit — ProStroke Billiard";

        function draw() {
          const favIds = store.getFavorites();
          const favCues = allCues.filter(function (c) { return favIds.includes(c.id); });

          container.innerHTML =
            '<section class="page-banner">' +
            '  <div class="container">' +
            '    <h1>Tongkat Favorit Anda</h1>' +
            '    <div class="breadcrumb">' +
            '      <a href="index.html">Beranda</a>' +
            '      <span>/</span>' +
            '      <strong style="color:#ffffff;">Favorit</strong>' +
            '    </div>' +
            '  </div>' +
            '</section>' +
            '<section class="section-block">' +
            '  <div class="container">' +
            '    <div class="section-header">' +
            '      <h2>Koleksi Tersimpan</h2>' +
            '      <span>' + favCues.length + ' produk favorit</span>' +
            '    </div>' +
            (favCues.length
              ? '<div class="catalog-grid">' + favCues.map(renderCueCard).join("") + '</div>'
              : '<div class="panel empty-state">' +
                '  <h3>Belum ada tongkat favorit</h3>' +
                '  <p>Klik ikon hati (&#9829;) pada kartu produk di katalog untuk menyimpannya di sini.</p>' +
                '  <a href="index.html" class="btn-gold">Jelajahi Katalog</a>' +
                '</div>') +
            '  </div>' +
            '</section>';
        }
        draw();
        store.onRealtimeUpdate(draw);
      }

      // 4. Product Detail View
      function renderProductDetailView(container, cue) {
        document.title = cue.name + " — ProStroke Billiard";
        const related = allCues.filter(function (c) {
          return c.id !== cue.id && c.kategoriId === cue.kategoriId;
        }).slice(0, 4);

        let selectedTip = cue.tip;
        let selectedWeight = cue.weight;
        let selectedPkgName = "Standard Softcase";
        let selectedPkgExtra = 0;
        let detailQty = 1;

        container.innerHTML =
          '<section class="page-banner">' +
          '  <div class="container">' +
          '    <h1>Detail Tongkat Billiard</h1>' +
          '    <div class="breadcrumb">' +
          '      <a href="index.html">Beranda</a>' +
          '      <span>/</span>' +
          '      <a href="index.html?kategori=' + cue.kategoriId + '">' + store.escapeHtml(cue.kategoriNama) + '</a>' +
          '      <span>/</span>' +
          '      <strong style="color:#ffffff;">' + store.escapeHtml(cue.name) + '</strong>' +
          '    </div>' +
          '  </div>' +
          '</section>' +
          '<section class="section-block">' +
          '  <div class="container">' +
          '    <div class="detail-grid">' +
          '      <div>' +
          '        <div class="detail-gallery">' +
          '          <img src="' + store.escapeHtml(store.getImageUrl(cue.image)) + '" alt="' + store.escapeHtml(cue.name) + '" onerror="PSStore.handleImgError(this, \'' + store.escapeHtml(cue.image) + '\')">' +
          '        </div>' +
          '        <div class="detail-spec-row">' +
          '          <div class="spec-mini"><span>Diameter Tip</span><strong>' + store.escapeHtml(cue.tip) + '</strong></div>' +
          '          <div class="spec-mini"><span>Berat Standar</span><strong>' + store.escapeHtml(cue.weight) + '</strong></div>' +
          '          <div class="spec-mini"><span>Tipe Joint</span><strong>' + store.escapeHtml(cue.joint) + '</strong></div>' +
          '        </div>' +
          '      </div>' +
          '      <div>' +
          '        <span class="cat-label">' + store.escapeHtml(cue.kategoriJudul) + '</span>' +
          '        <h2 class="detail-title">' + store.escapeHtml(cue.name) + '</h2>' +
          '        <div style="display:flex; gap:1rem; font-size:0.86rem; margin-bottom:0.5rem;">' +
          '          <span class="rating-label">&#9733; ' + cue.rating.toFixed(1) + ' (Terverifikasi)</span>' +
          '          <span style="color:#6ee7b7; font-weight:600;">&bull; ' + store.escapeHtml(cue.status) + '</span>' +
          '        </div>' +
          '        <div class="detail-price-wrap">' +
          '          <span class="detail-price-now" id="detail-price-now">' + store.formatRupiah(cue.price) + '</span>' +
          (cue.oldPrice ? '<span class="price-old" id="detail-price-old" style="font-size:1rem;">' + store.formatRupiah(cue.oldPrice) + '</span>' : '') +
          '        </div>' +
          '        <p style="color:#cbd5d0; font-size:0.95rem; margin-bottom:1.25rem;">' +
          '          ' + store.escapeHtml(cue.name) + ' menggunakan material <strong>' + store.escapeHtml(cue.material) + '</strong> dengan tipe joint <strong>' + store.escapeHtml(cue.joint) + '</strong>. Didesain untuk menghasilkan akurasi pukulan tinggi, getaran minimal, dan kontrol bola putih yang presisi.' +
          '        </p>' +
          '        <div class="variant-block">' +
          '          <span class="variant-label">Pilih Diameter Tip:</span>' +
          '          <div class="chip-row" id="tip-chips"></div>' +
          '        </div>' +
          '        <div class="variant-block">' +
          '          <span class="variant-label">Pilih Berat (oz):</span>' +
          '          <div class="chip-row" id="weight-chips"></div>' +
          '        </div>' +
          '        <div class="variant-block">' +
          '          <span class="variant-label">Paket Proteksi &amp; Aksesoris:</span>' +
          '          <div class="chip-row" id="pkg-chips"></div>' +
          '        </div>' +
          '        <div class="detail-actions">' +
          '          <div class="qty-stepper">' +
          '            <button type="button" id="qty-minus">&minus;</button>' +
          '            <span id="detail-qty">1</span>' +
          '            <button type="button" id="qty-plus">+</button>' +
          '          </div>' +
          '          <button class="btn-gold" type="button" id="detail-add-btn" style="flex:1;">+ Tambah ke Keranjang</button>' +
          '          <button class="btn-green-lg" type="button" id="detail-buy-btn">Beli Sekarang &rarr;</button>' +
          '        </div>' +
          '        <div class="detail-notice">' +
          '          <strong>Garansi ProStroke:</strong> Gratis Joint Protector + Packing Pipa PVC Tebal. Garansi tukar baru bila shaft diterima dalam kondisi bengkok.' +
          '        </div>' +
          '      </div>' +
          '    </div>' +
          '    <div class="tabs-card">' +
          '      <div class="tabs-head">' +
          '        <button class="tab-btn active" type="button" data-tab="desc">Deskripsi &amp; Keunggulan</button>' +
          '        <button class="tab-btn" type="button" data-tab="specs">Spesifikasi Teknis</button>' +
          '        <button class="tab-btn" type="button" data-tab="care">Panduan Perawatan</button>' +
          '      </div>' +
          '      <div class="tab-panel active" id="tab-desc">' +
          '        <p>' + store.escapeHtml(cue.kategoriDeskripsi) + '</p>' +
          '        <ul class="checklist">' +
          '          <li>Titik keseimbangan (balance point) terkalibrasi ideal untuk kontrol cue ball.</li>' +
          '          <li>Grip ergonomis anti-selip saat bermain dalam durasi lama.</li>' +
          '          <li>Sudah melalui uji rolling datar sebelum dikemas.</li>' +
          '        </ul>' +
          '      </div>' +
          '      <div class="tab-panel" id="tab-specs">' +
          '        <ul class="checklist">' +
          '          <li>Material Utama: ' + store.escapeHtml(cue.material) + '</li>' +
          '          <li>Diameter Tip Bawaan: ' + store.escapeHtml(cue.tip) + '</li>' +
          '          <li>Berat Standar: ' + store.escapeHtml(cue.weight) + '</li>' +
          '          <li>Konektor / Joint: ' + store.escapeHtml(cue.joint) + '</li>' +
          '          <li>Panjang Standar: 58 Inch (147 cm) 2-Piece</li>' +
          '        </ul>' +
          '      </div>' +
          '      <div class="tab-panel" id="tab-care">' +
          '        <ul class="checklist">' +
          '          <li>Simpan tongkat dalam kondisi lurus (digantung vertikal atau masuk hardcase).</li>' +
          '          <li>Hindari suhu panas berlebih seperti bagasi mobil di siang hari.</li>' +
          '          <li>Lap shaft menggunakan kain microfiber kering setelah bermain.</li>' +
          '        </ul>' +
          '      </div>' +
          '    </div>' +
          '    <div class="section-header">' +
          '      <h2>Produk Terkait di ' + store.escapeHtml(cue.kategoriNama) + '</h2>' +
          '      <a href="index.html?kategori=' + cue.kategoriId + '" style="color:#c9a24d; text-decoration:none; font-size:0.88rem;">Lihat Semua &rarr;</a>' +
          '    </div>' +
          '    <div class="catalog-grid">' + related.map(renderCueCard).join("") + '</div>' +
          '  </div>' +
          '</section>';

        const tipOptions = ["12.25 mm", "12.5 mm", "12.75 mm"];
        if (!tipOptions.includes(cue.tip)) tipOptions.push(cue.tip);
        const weightOptions = ["18.5 oz", "19.0 oz", "19.5 oz"];
        if (!weightOptions.includes(cue.weight)) weightOptions.push(cue.weight);
        const pkgOptions = [
          { name: "Standard Softcase", label: "Standard Softcase (+Rp 0)", extra: 0 },
          { name: "Hardcase & Chalk", label: "+ Hardcase & Chalk (+Rp 250.000)", extra: 250000 }
        ];

        function renderChips() {
          document.getElementById("tip-chips").innerHTML = tipOptions.map(function (t) {
            return '<button type="button" class="chip ' + (selectedTip === t ? "active" : "") + '" data-tip="' + t + '">' + t + "</button>";
          }).join("");
          document.getElementById("weight-chips").innerHTML = weightOptions.map(function (w) {
            return '<button type="button" class="chip ' + (selectedWeight === w ? "active" : "") + '" data-weight="' + w + '">' + w + "</button>";
          }).join("");
          document.getElementById("pkg-chips").innerHTML = pkgOptions.map(function (p) {
            return '<button type="button" class="chip ' + (selectedPkgName === p.name ? "active" : "") + '" data-pkg="' + p.name + '" data-extra="' + p.extra + '">' + p.label + "</button>";
          }).join("");

          document.getElementById("detail-price-now").textContent = store.formatRupiah(cue.price + selectedPkgExtra);
          const oldEl = document.getElementById("detail-price-old");
          if (oldEl && cue.oldPrice) {
            oldEl.textContent = store.formatRupiah(cue.oldPrice + selectedPkgExtra);
          }
        }

        document.getElementById("tip-chips").addEventListener("click", function (e) {
          if (e.target.dataset.tip) { selectedTip = e.target.dataset.tip; renderChips(); }
        });
        document.getElementById("weight-chips").addEventListener("click", function (e) {
          if (e.target.dataset.weight) { selectedWeight = e.target.dataset.weight; renderChips(); }
        });
        document.getElementById("pkg-chips").addEventListener("click", function (e) {
          if (e.target.dataset.pkg) {
            selectedPkgName = e.target.dataset.pkg;
            selectedPkgExtra = parseInt(e.target.dataset.extra, 10) || 0;
            renderChips();
          }
        });

        document.getElementById("qty-minus").addEventListener("click", function () {
          detailQty = Math.max(1, detailQty - 1);
          document.getElementById("detail-qty").textContent = detailQty;
        });
        document.getElementById("qty-plus").addEventListener("click", function () {
          detailQty += 1;
          document.getElementById("detail-qty").textContent = detailQty;
        });

        document.getElementById("detail-add-btn").addEventListener("click", function () {
          const variant = selectedTip + " / " + selectedWeight + " / " + selectedPkgName;
          store.addToCart(cue.id, detailQty, variant, selectedPkgExtra);
          store.showToast(cue.name + " (" + detailQty + "x) masuk ke keranjang!");
        });

        document.getElementById("detail-buy-btn").addEventListener("click", function () {
          const variant = selectedTip + " / " + selectedWeight + " / " + selectedPkgName;
          store.addToCart(cue.id, detailQty, variant, selectedPkgExtra);
          window.location.href = "cart.html";
        });

        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
            document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
            btn.classList.add("active");
            document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
          });
        });

        renderChips();
      }

      // Global Card Click Delegation (Quick Add & Favorite Toggle)
      const mainEl = document.getElementById("main-content");
      mainEl.addEventListener("click", function (e) {
        const favBtn = e.target.closest("[data-fav-id]");
        if (favBtn) {
          e.preventDefault();
          e.stopPropagation();
          const id = parseInt(favBtn.getAttribute("data-fav-id"), 10);
          const added = store.toggleFavorite(id);
          store.showToast(added ? "Disimpan ke daftar favorit!" : "Dihapus dari daftar favorit");
          if (favoritParam === "1") {
            renderFavoritesView(mainEl);
          } else {
            favBtn.classList.toggle("active", added);
          }
          return;
        }

        const addBtn = e.target.closest("[data-quick-add]");
        if (addBtn) {
          const id = parseInt(addBtn.getAttribute("data-quick-add"), 10);
          const cue = store.getCueById(id);
          if (!cue) return;
          const variant = cue.tip + " / " + cue.weight + " / Standard Softcase";
          store.addToCart(id, 1, variant, 0);
          store.showToast(cue.name + " ditambahkan ke keranjang!");
          const countNow = getQtyInCartByCueId(id);
          addBtn.textContent = "+ Tambah (" + countNow + ")";
        }
      });

      if (activeCue) {
        renderProductDetailView(mainEl, activeCue);
      } else if (activeCat) {
        renderCategoryView(mainEl, activeCat);
      } else if (favoritParam === "1") {
        renderFavoritesView(mainEl);
      } else {
        renderHomeView(mainEl);
      }
    })();
  </script>
</body>
</html>
